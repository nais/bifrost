dependencies:
  - allOf:
      - monitoring-crds

environmentKinds:
  - management

values:
  backend.google.projectId:
    displayName: google project id
    computed:
      template: '"{{.Management.project_id}}"'
  backend.google.serviceAccountEmail:
    displayName: google service account Email
    computed:
      template: '"{{.Management.bifrost_sa}}"'
  backend.image.tag:
    config:
      type: string

  # API authentication (pre-shared key shared with nais-api).
  backend.auth.apiKeys:
    displayName: Bifrost API pre-shared key(s)
    description: Comma-separated keys accepted by the API. Multiple values allow rotation without downtime.
    computed:
      template: '"{{ .Management.bifrost_api_key }}"'
  # Enforcement defaults on as of 2026-08-20, after a 24h window in which
  # bifrost_api_auth_requests_total recorded 1373 authenticated requests, zero
  # unauthenticated and zero rejected. The accept-then-enforce phase is over.
  #
  # The per-environment override is deliberately kept for now: enforcement is
  # the one setting whose failure mode is total — a tenant whose nais-api is not
  # sending the key loses every write path at once, and the fastest remedy has
  # to be a toggle rather than a revert-and-redeploy. It is removed in #580 once
  # a further 24h confirms nothing is rejected anywhere.
  backend.auth.enforced:
    displayName: Enforce API authentication (reject unauthenticated requests)
    description: >-
      On by default. A request without a valid key is rejected with 401, so a tenant whose nais-api is
      not sending the key loses every write path. Turn off for a single environment only as an
      emergency measure, and watch bifrost_api_auth_requests_total{outcome="rejected"}.
    computed:
      template: 'true'
    config:
      type: bool
  # Reconciler rollout, in order: enabled+dryRun -> +autoAdopt -> -autoAdopt -> -dryRun.
  #
  # enabled and dryRun default on together, so every tenant runs the loop in
  # observe mode. That costs one namespace List per resync and writes nothing.
  # It is deliberately a default rather than a per-environment opt-in: nothing
  # exports whether the reconciler is enabled, so while tenants differ, a zero
  # bifrost_reconciler_instances_updated_timestamp_seconds is ambiguous between
  # "switched off here" and "running but broken". Uniform means a zero
  # timestamp is unambiguously the second, which is the one worth alerting on.
  # Either can still be turned off for a single environment.
  backend.reconciler.enabled:
    displayName: Enable the Unleash reconcile loop
    description: >-
      On by default in observe mode. A tenant with no Unleash instances is expected to report
      managed=0, unmanaged=0 with a non-zero census timestamp — that reads as "measured and empty",
      not as "not running". See docs/RECONCILER_RUNBOOK.md.
    computed:
      template: 'true'
    config:
      type: bool
  backend.reconciler.dryRun:
    displayName: Reconciler dry-run (observe only, no writes)
    description: Must stay on while adoption is on — bifrost refuses to start with both adoption enabled and dry-run off. Turn off last, once adoption is off again.
    computed:
      template: 'true'
    config:
      type: bool
  backend.reconciler.autoAdopt:
    displayName: Adopt unlabelled Unleash instances in bifrost's namespace
    description: >-
      Stamps only the managed-by label, never the desired-state annotation, so instances created before the label
      become visible to the reconciler. Requires dry-run to be on: bifrost refuses to start otherwise, because an
      adopted instance carries no recorded intent and converging one means rendering it from a lossy read-back of its
      own spec. Label an instance bifrost.nais.io/adopt=false (that exact lowercase value) to keep it out; anything
      else is logged and adopted.
      Expect this to look like nothing happened: at most ONE instance is adopted per resync interval (10m by
      default), and only instances whose status says Reconciled=True and not Degraded — a label change wakes a
      reconcile in unleasherator, so stamping a whole fleet at once would converge every drifted instance
      simultaneously. A fleet of 60 takes about ten hours. If an instance goes degraded after bifrost stamps it,
      adoption halts for good and bifrost_reconciler_adoption_halted goes to 1; only a restart or toggling this
      switch off and on again resumes it. Watch bifrost_reconciler_adoptions_total (result=adopted, unhealthy,
      halted) rather than the logs.
    computed:
      template: 'true'
    config:
      type: bool

  backend.unleash.apiIngressClass:
    displayName: Api Ingress Class
    computed:
      template: '"internal-haproxy"'
  backend.unleash.apiIngressHost:
    displayName: Api Ingress Host
    computed:
      template: '"{{ subdomain . "unleash-api" }}"'
  backend.unleash.defaultReleaseChannel:
    displayName: Default release channel for new instances
    config:
      type: string
  backend.unleash.migration.enabled:
    displayName: Enable migration from custom versions to release channel
    config:
      type: bool
  backend.unleash.migration.targetChannel:
    displayName: Target release channel for migration
    config:
      type: string
  backend.unleash.migration.healthTimeout:
    displayName: Health check timeout for migration (e.g. 5m)
    config:
      type: string
  backend.unleash.migration.delay:
    displayName: Delay between instance migrations (e.g. 30s)
    config:
      type: string
  backend.unleash.channelMigration.enabled:
    displayName: Enable channel-to-channel migration (e.g. v5 to v6)
    config:
      type: bool
  backend.unleash.channelMigration.map:
    displayName: "Channel migration map (e.g. stable-v5:stable-v6,rapid-v5:rapid-v6)"
    config:
      type: string
  backend.unleash.channelMigration.healthTimeout:
    displayName: Health check timeout for channel migration (e.g. 5m)
    config:
      type: string
  backend.unleash.channelMigration.delay:
    displayName: Delay between channel migrations (e.g. 30s)
    config:
      type: string
  backend.unleash.googleServiceAccountEmail:
    displayName: Biforst unleash Google service account email
    computed:
      template: '"{{ .Management.bifrost_unleash_sql_gsa_email }}"'
  backend.unleash.instanceNamespace:
    displayName: Unleash instance namespace
    computed:
      template: '"{{ .Management.bifrost_unleash_namespace}}"'
  backend.unleash.kubernetesServiceAccountName:
    displayName: Bifrost kubernetes service account name
    computed:
      template: '"{{ .Management.bifrost_unleash_sql_ksa_name }}"'
  backend.unleash.sqlInstanceAddress:
    displayName: Unleash sql instance address
    computed:
      template: '"{{ .Management.bifrost_unleash_sql_instance_address }}"'
  backend.unleash.sqlInstanceId:
    displayName: Unleash sql instance id
    computed:
      template: '"{{.Management.bifrost_unleash_sql_instance_id}}"'
  backend.unleash.sqlInstanceRegion:
    displayName: Unleash sql instance region
    computed:
      template: '"{{ .Management.bifrost_unleash_sql_instance_region }}"'

  backend.unleash.naisApiAddress:
    displayName: Nais API gRPC address for Unleash instances
    config:
      type: string
  backend.unleash.naisApiNamespace:
    displayName: Nais API namespace for Unleash instances
    config:
      type: string
  backend.unleash.webIngressClass:
    displayName: Web Ingress Class
    computed:
      template: '"external-fa-haproxy"'
  backend.unleash.webIngressHost:
    displayName: Web Ingress Host
    computed:
      template: '"{{ subdomain . "unleash-web.iap" }}"'
  backend.unleash.webOAuthJWTAudience:
    displayName: Unleash web OAuth JWT audience
    computed:
      template: '"{{ .Env.wonderwall_forward_auth_zitadel_client_id }}"'
  networkPolicy.allowDNS:
    computed:
      template: "true"
  networkPolicy.apiServerCIDR:
    computed:
      template: '"{{ .Env.apiserver_endpoint }}/32"'
    ignoreKind:
      - onprem
  networkPolicy.enabled:
    computed:
      template: '{{ne .Kind "onprem"}}'
