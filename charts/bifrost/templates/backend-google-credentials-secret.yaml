{{/*
Only rendered when the chart is handed an explicit Google credentials document.
Every real environment leaves backend.google.serviceAccountCredentialsJson
empty and authenticates through Workload Identity, so this file renders nothing
there — see the comment on the value in values.yaml.
*/}}
{{- if .Values.backend.google.serviceAccountCredentialsJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bifrost.fullname" . }}-google-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
type: Opaque
stringData:
  service-account-credentials.json: {{ .Values.backend.google.serviceAccountCredentialsJson | quote }}
{{- end }}
