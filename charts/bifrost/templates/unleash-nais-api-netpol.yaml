apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-unleash-to-nais-api-grpc
  namespace: nais-system
spec:
  podSelector:
    matchLabels:
      app: nais-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bifrost-unleash
      ports:
        - port: 3001
          protocol: TCP
