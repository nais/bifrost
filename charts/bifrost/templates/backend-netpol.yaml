{{- if and .Values.networkPolicy .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-backend
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nais-api
  # Metrics scraping. The pod selector alone is scoped to this namespace, and
  # it does not match the prometheus-agent that actually scrapes here — the
  # target is discovered but every scrape fails, so up stays 0. Match on the
  # namespace as well, which is what the Unleash instances' policies do and
  # what demonstrably works in this cluster.
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.metricsNamespace | default "nais-system" }}
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  egress:
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.apiServerCIDR | required "networkPolicy.apiServerCIDR is required" }}
  {{- if .Values.networkPolicy.allowDNS }}
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: node-local-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  {{- end }}
  # GitHub API
  - to:
    - ipBlock:
        cidr: 140.82.121.5/32
    - ipBlock:
        cidr: 140.82.121.6/32
    ports:
    - port: 443
      protocol: TCP
  podSelector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      component: backend
  policyTypes:
  - Egress
  - Ingress
{{- end }}
