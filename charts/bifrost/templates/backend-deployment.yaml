apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost.fullname" . }}-backend
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. With no strategy set, maxSurge
  # rounds up to 1 and every deploy overlaps two pods — each running a
  # reconcile loop, with leader election off. In steady state that is merely
  # noisy: both render the same spec, so the loser of the race takes a 409 from
  # the optimistic lock and increments the error counter the rollout is meant to
  # be reading. But when the deploy itself carries a global-config change, the
  # two pods render *different* desired specs, each patch requeues the instance
  # on the other pod through its watch, and instances flip-flop at API latency
  # for the whole overlap — with unleasherator redeploying the workload on each
  # flip. The cost of Recreate is a few seconds of API downtime per deploy, and
  # bifrost's only caller is nais-api, which retries.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bifrost.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "bifrost.labels" . | nindent 8 }}
        component: backend
      annotations:
        kubectl.kubernetes.io/default-container: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ include "bifrost.name" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args: ["run"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Top level
            - name: BIFROST_PORT
              value: "8080"
            - name: BIFROST_HOST
              value: "0.0.0.0"
            - name: BIFROST_VERSION
              value: {{ .Values.backend.image.tag | quote }}
            - name: GIN_MODE
              value: {{ if .Values.backend.debugEnabled }}debug{{ else }}release{{ end }}
            - name: BIFROST_LOG_LEVEL
              value: {{ .Values.backend.logLevel | quote }}
            # Google
            - name: BIFROST_GOOGLE_PROJECT_ID
              value: {{ .Values.backend.google.projectId | quote }}
            # Unleash
            - name: BIFROST_UNLEASH_SQL_INSTANCE_ID
              value: {{ .Values.backend.unleash.sqlInstanceId | required ".unleash.sqlInstanceId is required" | quote }}
            - name: BIFROST_UNLEASH_SQL_INSTANCE_ADDRESS
              value: {{ .Values.backend.unleash.sqlInstanceAddress | required ".unleash.sqlInstanceAddress is required" | quote }}
            - name: BIFROST_UNLEASH_SQL_INSTANCE_REGION
              value: {{ .Values.backend.unleash.sqlInstanceRegion | required ".unleash.sqlInstanceRegion is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_NAMESPACE
              value: {{ .Values.backend.unleash.instanceNamespace | required ".unleash.instanceNamespace is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_SERVICEACCOUNT
              value: {{ .Values.backend.unleash.kubernetesServiceAccountName | required ".unleash.kubernetesServiceAccountName is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_WEB_INGRESS_CLASS
              value: {{ .Values.backend.unleash.webIngressClass | required ".unleash.webIngressClass is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_WEB_INGRESS_HOST
              value: {{ .Values.backend.unleash.webIngressHost | required ".unleash.webIngressHost is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_API_INGRESS_CLASS
              value: {{ .Values.backend.unleash.apiIngressClass | required ".unleash.apiIngressClass is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_API_INGRESS_HOST
              value: {{ .Values.backend.unleash.apiIngressHost | required ".unleash.apiIngressHost is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_WEB_OAUTH_JWT_AUDIENCE
              value: {{ .Values.backend.unleash.webOAuthJWTAudience | required ".unleash.webOAuthJWTAudience is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_TEAMS_API_URL
              value: {{ .Values.backend.unleash.teamsApiUrl | required ".unleash.teamsApiUrl is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_TEAMS_API_SECRET_NAME
              value: {{ .Values.backend.unleash.teamsApiTokenSecretName | required ".unleash.teamsApiTokenSecretName is required" | quote }}
            - name: BIFROST_UNLEASH_INSTANCE_TEAMS_API_TOKEN_SECRET_KEY
              value: {{ .Values.backend.unleash.teamsApiTokenSecretKey | required ".unleash.teamsApiTokenSecretKey is required" | quote }}
            {{- if .Values.backend.unleash.defaultReleaseChannel }}
            - name: BIFROST_UNLEASH_DEFAULT_RELEASE_CHANNEL
              value: {{ .Values.backend.unleash.defaultReleaseChannel | quote }}
            {{- end }}
            {{- if .Values.backend.unleash.migration.enabled }}
            - name: BIFROST_UNLEASH_MIGRATION_ENABLED
              value: "true"
            - name: BIFROST_UNLEASH_MIGRATION_TARGET_CHANNEL
              value: {{ .Values.backend.unleash.migration.targetChannel | quote }}
            - name: BIFROST_UNLEASH_MIGRATION_HEALTH_TIMEOUT
              value: {{ .Values.backend.unleash.migration.healthTimeout | quote }}
            - name: BIFROST_UNLEASH_MIGRATION_DELAY
              value: {{ .Values.backend.unleash.migration.delay | quote }}
            {{- end }}
            {{- if .Values.backend.unleash.channelMigration.enabled }}
            - name: BIFROST_UNLEASH_CHANNEL_MIGRATION_ENABLED
              value: "true"
            - name: BIFROST_UNLEASH_CHANNEL_MIGRATION_MAP
              value: {{ .Values.backend.unleash.channelMigration.map | quote }}
            - name: BIFROST_UNLEASH_CHANNEL_MIGRATION_HEALTH_TIMEOUT
              value: {{ .Values.backend.unleash.channelMigration.healthTimeout | quote }}
            - name: BIFROST_UNLEASH_CHANNEL_MIGRATION_DELAY
              value: {{ .Values.backend.unleash.channelMigration.delay | quote }}
            {{- end }}

            # API authentication (pre-shared key from nais-api). See docs/RECONCILER_IMPROVEMENT_PLAN.md.
            - name: BIFROST_AUTH_ENFORCED
              value: {{ .Values.backend.auth.enforced | quote }}
            {{- if .Values.backend.auth.apiKeys }}
            - name: BIFROST_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.auth.secretName }}
                  key: {{ .Values.backend.auth.secretKey }}
            {{- end }}
            # Reconciler (dark-launch via dry-run; see docs/RECONCILER_IMPROVEMENT_PLAN.md §6a).
            # To stop it, and to know what stopping it does not stop: docs/RECONCILER_RUNBOOK.md.
            - name: BIFROST_RECONCILER_ENABLED
              value: {{ .Values.backend.reconciler.enabled | quote }}
            - name: BIFROST_RECONCILER_DRY_RUN
              value: {{ .Values.backend.reconciler.dryRun | quote }}
            - name: BIFROST_RECONCILER_RESYNC_INTERVAL
              value: {{ .Values.backend.reconciler.resyncInterval | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
