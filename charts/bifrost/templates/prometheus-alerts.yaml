{{/*
The instance namespace is the only value this file interpolates, and it lands in
PromQL rather than in a Kubernetes field, so an unset one used to fail inside the
`replace` below as `invalid value; expected string` — a message naming neither
the value nor the file. Bind it once through `required`, with the same message
the deployment uses, so a missing value names itself here too.
*/}}
{{- $instanceNamespace := .Values.backend.unleash.instanceNamespace | required ".unleash.instanceNamespace is required" -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
spec:
  groups:
    - name: unleash_database_alerts
      rules:
      - alert: UnleashHighDatabaseLatency
        expr: sum(db_query_duration_seconds{quantile="0.9", namespace="{{ $instanceNamespace }}"}) by (service) > 0.5
        for: 10m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: |
            {{ "The p99 database query latency for Unleash instance `{{ $labels.service }}` has been above 0.5 seconds for the last 5 minutes." }}
          consequence: "Applications may experience slow response times from Unleash API and UI."
          action: |
            {{ "Check the database for slow queries and add indexes where appropriate." }}

    - name: unleash_http_alerts
      rules:
      - alert: UnleashUnsuccessfulNginxRequests
        expr: sum(rate(nginx_ingress_controller_requests{namespace="{{ $instanceNamespace }}", status=~"5.."}[5m])) / sum(rate(nginx_ingress_controller_requests{namespace="{{ $instanceNamespace }}"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "High rate of unsuccessful requests for Nginx Ingress Controller"
          consequence: "Applications may problems fetching feature toggles from Unleash or taking actions in the Unleash UI."
          action: "Check the Nginx Ingress Controller logs request endpoints for errors and investigate the root cause of the issue."

      - alert: UnleashUnsuccessfulRequests
        expr: sum(rate(haproxy_backend_http_responses_total{proxy=~"{{ $instanceNamespace | replace "-" "_" }}_svc_.+", code=~"4xx|5xx"}[5m])) / sum(rate(haproxy_backend_http_responses_total{proxy="{{ $instanceNamespace | replace "-" "_" }}_svc_.+"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "High rate of unsuccessful requests for HAProxy Ingress Controller"
          consequence: "Applications may problems fetching feature toggles from Unleash or taking actions in the Unleash UI."
          action: "Check the HAProxy Ingress Controller logs request endpoints for errors and investigate the root cause of the issue."

    - name: unleasherator_alerts
      rules:
      - alert: UnleasheratorConnectionProblem
        expr: unleasherator_unleash_status{status="Connected"} == 0
        for: 5m
        labels:
          severity: critical
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "No connected instances for Unleash"
          consequence: "Unleasherator is not able to connect to Unleash and create new API keys for applications."
          action: "Check the Unleasherator logs for errors and investigate the root cause of the issue."

    - name: bifrost_reconciler_alerts
      rules:
      # The census is what makes every other reconciler number readable, so its
      # freshness is the first thing to alert on.
      #
      # Gated by a Helm conditional rather than by a term in the expression: the
      # enabled flag is not exported as a metric, and a rendered Go bool is not
      # valid PromQL — `false and <vector>` is rejected outright. Rendering the
      # rule only where the reconciler is enabled gives the same meaning and a
      # valid expression. It also lets the threshold catch a timestamp stuck at
      # 0, which is "no census has ever completed" — the case a `> 0` guard
      # would silently exclude, and the one that matters most.
{{- if .Values.backend.reconciler.enabled }}
      - alert: BifrostReconcilerMetricsAbsent
        expr: absent(bifrost_reconciler_instances_updated_timestamp_seconds{namespace="{{ .Release.Namespace }}"}) == 1
        for: 10m
        labels:
          severity: critical
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost reconciler metrics are absent"
          consequence: "The reconciler may be unavailable and its census-stalled alert cannot evaluate."
          action: "Check the bifrost-backend workload, Prometheus scrape status, and backend metrics endpoint."

      - alert: BifrostReconcilerCensusStalled
        expr: (time() - bifrost_reconciler_instances_updated_timestamp_seconds) > 1800
        for: 10m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "The bifrost reconciler has not completed an instance census in over 30 minutes"
          consequence: "Every bifrost_reconciler_* gauge is stale, so the fleet counts cannot be trusted and a drifting instance would go unreported. A timestamp of 0 means no census has ever completed — the manager is likely not running at all."
          action: "Check the bifrost-backend logs for a cache-sync or namespace error. See docs/RECONCILER_RUNBOOK.md."
{{- end }}

      # Distinct from the census: this fires when the loop runs but individual
      # instances fail. intent_error is included because an instance whose
      # desired-state annotation cannot be read drops out of the managed set
      # while every other metric still reads healthy.
      - alert: BifrostReconcilerErrors
        expr: sum(rate(bifrost_reconciler_actions_total{action=~"error|intent_error"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "The bifrost reconciler is failing to reconcile instances"
          consequence: "Affected instances are not converging to their configuration, and an instance failing on intent_error has dropped out of the managed set without changing any other metric."
          action: "Break down by reason: sum by (action, reason) (bifrost_reconciler_actions_total). See docs/RECONCILER_RUNBOOK.md."

      - alert: BifrostReconcilerNotConverging
        expr: |
          max(bifrost_reconciler_managed_instances) > 0
          and
          sum(increase(bifrost_reconciler_actions_total{action="changed"}[30m]))
            >= 3 * max(bifrost_reconciler_managed_instances)
        for: 10m
        labels:
          severity: critical
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost repeatedly changes managed Unleash instances without converging"
          consequence: "Repeated reconciliation writes can cause continuous workload rollouts."
          action: "Inspect reconciler action reasons and the desired-state annotation for affected instances. Disable the reconciler for the tenant if writes must stop."

      - alert: BifrostReconcilerInstanceLoopInactive
        expr: |
          max(bifrost_reconciler_managed_instances) > 0
          and
          sum(increase(bifrost_reconciler_actions_total{action!="skipped"}[30m]))
            < max(bifrost_reconciler_managed_instances)
        for: 10m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost census runs but managed instances are not being reconciled"
          consequence: "A managed instance may no longer receive desired-state convergence."
          action: "Check controller-runtime logs and reconcile action metrics by reason."

      - alert: BifrostAdoptionPendingVerification
        expr: bifrost_reconciler_adoption_pending_verification > 0
        for: 30m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost is waiting for a fully adopted Unleash instance to become healthy"
          consequence: "Progressive adoption cannot start another instance until the pending CR reports Reconciled=True and Connected=True for its current generation."
          action: "Find the pending instance in bifrost-backend logs, inspect its Unleash CR conditions and workload, and do not enable migration admission until it is verified."

      # Adoption stamps one instance per sweep, so a sustained error rate means
      # instances are being left invisible to the reconciler rather than a
      # transient 409.
      - alert: BifrostAdoptionFailing
        expr: sum(rate(bifrost_reconciler_adoptions_total{result="error"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost keeps failing to adopt Unleash instances"
          consequence: "Bifrost has stopped the current UID-bound checkpoint or cannot persist its source snapshot and target hashes."
          action: "Check bifrost-backend logs and the bifrost-legacy-adoption ConfigMap. Do not delete or replace the ConfigMap; restore its checkpoint or resolve the recorded manual-recovery state."

      - alert: BifrostAdoptionCheckpointBlocked
        expr: max(bifrost_reconciler_adoption_checkpoint_state{state=~"failed|blocked"}) > 0
        for: 5m
        labels:
          severity: critical
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost legacy adoption checkpoint requires manual recovery"
          consequence: "No further legacy CR will be canonicalized until the UID, source snapshot, target hashes and ConfigMap binding are safe again."
          action: "Inspect bifrost-legacy-adoption and the named Unleash CR. Do not remove the CR marker or checkpoint to bypass the gate; restore a known-good checkpoint or disable autoAdopt and recover manually."

    - name: bifrost_auth_alerts
      rules:
      # Before enforcement a rejected request was impossible; an unauthenticated
      # one was merely counted. After it, a rejection means a caller has lost
      # every write path it has — nais-api not sending the key locks a whole
      # tenant out of creating, updating and deleting Unleash instances, and the
      # only symptom a user sees is that Console stops working.
      #
      # Deliberately not gated on backend.auth.enforced: the counter can only
      # increment where enforcement is on, so the rule is inert elsewhere, and
      # gating it would remove coverage from exactly the environments that have
      # it turned on out of band.
      - alert: BifrostAuthRejectingRequests
        expr: sum(rate(bifrost_api_auth_requests_total{outcome="rejected"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost is rejecting unauthenticated API requests"
          consequence: "A caller is presenting no key or the wrong one. If that caller is nais-api, every Unleash create, update and delete for this tenant is failing and Console appears broken to users."
          action: "Compare the key in fasit against what nais-api is sending. As an emergency measure set backend.auth.enforced=false for this environment to restore service, then fix the key. See docs/RECONCILER_RUNBOOK.md."

      # The mirror image, and the reason the accept phase existed: an
      # unauthenticated request that is still being allowed means enforcement is
      # off somewhere it should not be. Harmless in itself, but it is the state
      # #580 exists to end, and without a rule nobody would notice a tenant that
      # never got flipped.
      - alert: BifrostAuthNotEnforced
        expr: sum(rate(bifrost_api_auth_requests_total{outcome="unauthenticated_allowed"}[30m])) > 0
        for: 1h
        labels:
          severity: warning
          namespace: {{ .Release.Namespace }}
        annotations:
          summary: "Bifrost is allowing unauthenticated API requests"
          consequence: "Enforcement is off in this environment, so the API accepts calls with no key. The pre-shared key is providing no protection here."
          action: "Check backend.auth.enforced in fasit for this environment. It should be true everywhere as of 2026-08-20; see #576 and #580."
