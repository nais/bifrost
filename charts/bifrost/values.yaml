backend:
  image:
    repository: europe-north1-docker.pkg.dev/nais-io/nais/images/bifrost
    pullPolicy: Always
    tag: main
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  debugEnabled: false
  # Also gates controller-runtime's own output: the framework logs its
  # per-instance reconcile lines at V(5), which map to trace here, so raising
  # this to debug is safe but trace multiplies log volume by the fleet size.
  logLevel: info
  logFormat: json

  # API authentication. Bifrost is called only by nais-api; auth is a pre-shared
  # key held in fasit and injected into both. Ships in accept-then-enforce mode.
  auth:
    # Comma-separated pre-shared keys (multiple allow zero-downtime rotation).
    # Mapped from fasit; empty means authentication is effectively disabled.
    apiKeys: ""  # mapped in fasit
    # When true, requests without a valid key are rejected with 401.
    #
    # The chart default stays false so a bare `helm install` — which has no keys
    # either — does not reject everything it is sent. Fasit computes true for
    # every environment; see Feature.yaml for why the override is still there.
    enforced: false
    # Name/key of the Secret (created by this chart when apiKeys is set) that
    # holds the keys and is mounted into bifrost's env as BIFROST_API_KEYS.
    secretName: bifrost-api-key
    secretKey: api-keys

  # Reconcile loop that converges managed Unleash instances to their desired
  # config. Dark-launched: enable with dryRun=true first, watch
  # bifrost_reconciler_actions_total{action="would_change"} — the reason label
  # says whether that is spec drift or metadata backfill — then set dryRun=false.
  # The rollout is a sequence, and the two write switches below are mutually
  # exclusive: bifrost refuses to start with autoAdopt on and dryRun off.
  #   1. enabled + dryRun            — measure the instances already labelled
  #   2. enabled + dryRun + autoAdopt — adopt the rest, one instance per resync
  #                                      interval, measure the whole fleet
  #   3. enabled + dryRun + autoAdopt — left on; adoption shares the census's
  #                                      List, so a swept fleet costs nothing and
  #                                      a later stray instance is picked up
  #   4. enabled                     — dryRun off, the reconciler converges
  # Step 4 only converges instances that carry a desired-state annotation.
  # Adopted instances have none, and are reported as
  # bifrost_reconciler_actions_total{action="would_change",
  # reason="missing_desired_state"} and never written.
  reconciler:
    # Chart default stays off so a bare `helm install` does not start a control
    # loop unannounced. Fasit sets it on for every environment via Feature.yaml,
    # where the reasoning for making it a default rather than a per-environment
    # opt-in is written down.
    enabled: false
    # Defaults to observe-only, so enabling the reconciler cannot start
    # writing by accident. Turning dry-run off is the deliberate last step,
    # after the would_change counter has been read and autoAdopt is off again.
    dryRun: true
    # Stamp app.kubernetes.io/managed-by=bifrost on unlabelled Unleash
    # instances in the instance namespace, so a fleet created before the label
    # existed becomes visible to the reconciler as an observable, counted event
    # (bifrost_reconciler_adoptions_total) instead of one user PUT at a time.
    # Requires dryRun: true. Adoption stamps the label and never the
    # desired-state annotation — the only intent available for a legacy
    # instance is a lossy read-back of its own spec — so the instances it makes
    # visible are exactly the ones a writing reconciler must not converge.
    # An instance labelled bifrost.nais.io/adopt=false is left alone; only that
    # exact lowercase value opts out, and anything else is logged and adopted.
    #
    # It is paced, and turning it on therefore looks like nothing happening:
    #   * at most ONE instance is stamped per resyncInterval, because
    #     unleasherator reconciles on label changes, so a fleet-wide sweep
    #     would wake a reconcile per instance at once — each one able to
    #     converge a drifted workload and each ending in a live connectivity
    #     check. 60 instances at the 10m default is roughly ten hours.
    #   * only instances reporting Reconciled=True and not Degraded are
    #     eligible; the rest are counted (result=unhealthy) and retried later.
    #   * if the instance stamped last sweep goes Degraded=True or
    #     Reconciled=False, adoption stops completely and
    #     bifrost_reconciler_adoption_halted goes to 1. It does not recover on
    #     its own: read the error log line, look at the instance, then restart
    #     bifrost or toggle this flag.
    # Chart default off so a bare `helm install` does not start writing labels to
    # objects it has just met. Fasit computes true; see Feature.yaml for the
    # pacing and the halt behaviour, and keep the override — turning this off is
    # the fastest way to stop a sweep that is doing something unexpected.
    autoAdopt: false
    resyncInterval: "10m"

  unleash:
    # Kubernetes namespace to create unleash instances in
    # instanceNamespace:  # mapped in fasit

    # Shared Cloud SQL instance ID
    # sqlInstanceId:  # mapped in fasit
    # sqlInstanceAddress:  # mapped in fasit
    # sqlInstanceRegion:  # mapped in fasit

    # Shared service account (used by Cloud SQL auth proxy)
    # googleServiceAccountEmail:  # mapped in fasit
    # kubernetesServiceAccountName:  # mapped in fasit

    # Unleash user interface web ingress config
    # webIngressClass:  # mapped in fasit
    # webIngressHost:  # mapped in fasit

    # Unleash api ingress config
    # apiIngressClass:  # mapped in fasit
    # apiIngressHost:  # mapped in fasit


    # Unleash web oauth config
    # webOAuthJWTAudience: # mapped in fasit

    # Nais API gRPC endpoint for team authorization
    naisApiAddress: nais-api.nais-system:3001
    naisApiNamespace: nais-system

    # Default release channel for new instances (optional)
    # Set via Fasit per environment once ReleaseChannel CRDs are available
    defaultReleaseChannel: ""

    # Migration settings for transitioning custom versions to release channels
    # Enable this to migrate existing instances with custom versions to a release channel
    migration:
      enabled: false
      targetChannel: ""
      healthTimeout: "5m"
      delay: "30s"

    # Channel migration settings for transitioning between release channels (e.g., v5 to v6)
    # This is useful for major version upgrades across all instances on a specific channel
    channelMigration:
      enabled: false
      # Comma-separated list of source:target channel pairs, e.g. "stable-v5:stable-v6,rapid-v5:rapid-v6"
      map: ""
      healthTimeout: "5m"
      delay: "30s"


  google:
    # projectId:  # mapped in fasit
    # serviceAccountEmail:  # mapped in fasit

    # Cloud SQL admin credentials, as the contents of a JSON credentials file.
    # Empty in every environment this is deployed to for real: bifrost gets its
    # token from the GKE metadata server through Workload Identity, keyed off
    # the iam.gke.io/gcp-service-account annotation this chart puts on the
    # backend service account.
    #
    # Setting it mounts the document and points GOOGLE_APPLICATION_CREDENTIALS
    # at it, which takes precedence over Workload Identity. It exists for one
    # case: a cluster with no metadata server at all. Bifrost builds the Cloud
    # SQL admin client while it starts, before it serves anything, so without
    # some form of credentials the process exits before /healthz ever answers —
    # which is what stopped the chart from being installable under
    # chart-testing, where the cluster is kind. Deliberately not exposed in
    # Feature.yaml; nothing should set it in a real environment.
    serviceAccountCredentialsJson: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

networkPolicy:
  enabled: true
  allowDNS: true
  # apiServerCIDR is the CIDR of the Kubernetes API server.
  # apiServerCIDR: 1.2.3.4/32
  # Namespace the metrics scraper runs in. Ingress from it is allowed so
  # /metrics can be collected; see the comment in backend-netpol.yaml.
  metricsNamespace: nais-system

metrics:
  # Scrapes /metrics on the backend service. The endpoint was added in #549;
  # before that this had nothing to collect, which is why it defaulted off.
  enabled: true

alerts:
  enabled: true

# `helm test` hook. It is what makes the chart-testing run assert something
# beyond "the pod became ready": it calls the API through the Service, and
# checks that an enabled reconciler has actually published a census. See
# templates/tests/test-api.yaml.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.11.1"
