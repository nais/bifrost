    instanceNamespace: bifrost-unleash

    sqlInstanceId: foo
    sqlInstanceAddress: 1.2.3.4
    sqlInstanceRegion: foo

    googleServiceAccountEmail: foo@bar
    kubernetesServiceAccountName: foo

    webIngressClass: foo
    webIngressHost: foo.bar
    webOAuthJWTAudience: foo

    apiIngressClass: foo
    apiIngressHost: foo.bar

    naisApiAddress: nais-api.nais-system:3001
    naisApiNamespace: nais-system

    # Channel migration example config (disabled by default)
